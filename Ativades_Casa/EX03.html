<div class="card">
    <h2>Média Escolar</h2>
    <input type="text" id="nome" placeholder="Nome do Aluno">
    <input type="number" id="n1" placeholder="Nota 1" step="0.1">
    <input type="number" id="n2" placeholder="Nota 2" step="0.1">
    <input type="number" id="n3" placeholder="Nota 3" step="0.1">
    <button onclick="calcularMedia()">Calcular Resultado</button>
    <div id="resultadoMedia" style="margin-top: 15px; font-weight: bold;"></div>
</div>

<script>
    function calcularMedia() {
        const nome = document.getElementById('nome').value;
        const n1 = Number(document.getElementById('n1').value);
        const n2 = Number(document.getElementById('n2').value);
        const n3 = Number(document.getElementById('n3').value);
        const res = document.getElementById('resultadoMedia');

        const media = (n1 + n2 + n3) / 3;
        let mensagem = `${nome}, sua média é ${media.toFixed(2)}. `;

        if (media >= 7) {
            res.innerHTML = mensagem + "Status: APROVADO";
            res.style.color = "blue";
        } else if (media >= 4) {
            let falta = 10 - media;
            res.innerHTML = mensagem + `Status: EXAME (Falta ${falta.toFixed(2)} para 10)`;
            res.style.color = "green";
        } else {
            res.innerHTML = mensagem + "Status: REPROVADO";
            res.style.color = "red";
        }
    }
</script>
