<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Bank - Analisador de IIN & Validador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #f8fafc; }

        .card { background-color: #1e293b; width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 30px; border: 1px solid #334155; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #38bdf8; }
        p.subtitle { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 25px; }

        .input-box { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 18px; letter-spacing: 3px; text-align: center; outline: none; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }

        button { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0ea5e9; transform: translateY(-2px); }

        .panel { margin-top: 25px; display: none; border-radius: 12px; background: #0f172a; border: 1px solid #334155; overflow: hidden; }
        .panel-header { padding: 12px; text-align: center; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .valid { background: #065f46; color: #34d399; }
        .invalid { background: #7f1d1d; color: #f87171; }
        
        .info-grid { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 10px; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 14px; font-weight: 500; color: #f1f5f9; }
    </style>
</head>
<body>

<div class="card">
    <h1>Infinity Analyzer</h1>
    <p class="subtitle">Validação de Algoritmo Luhn & Extração de IIN</p>

    <div class="input-box">
        <label for="cardNumber">Número do Cartão (PAN)</label>
        <input type="text" id="cardNumber" maxlength="19" placeholder="0000 0000 0000 0000">
    </div>

    <button onclick="analisarCartao()">Analisar Cartão</button>

    <div id="resultPanel" class="panel">
        <div id="statusHeader" class="panel-header"></div>
        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">Bandeira</span>
                <span class="info-value" id="valBandeira">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Setor Industrial</span>
                <span class="info-value" id="valSetor">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">IIN (8 Dígitos)</span>
                <span class="info-value" id="valIIN">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Banco Emissor</span>
                <span class="info-value" id="valBanco">Identificado por IIN</span>
            </div>
        </div>
    </div>
</div>

<script>
   
    document.getElementById('cardNumber').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '');
        v = v.match(/.{1,4}/g)?.join(' ') || v;
        e.target.value = v;
    });

    function validarLuhn(numero) {
        let soma = 0;
        let deveDobrar = false;

        
        for (let i = numero.length - 1; i >= 0; i--) {
            let digito = parseInt(numero.charAt(i));

            if (deveDobrar) {
                digito *= 2;
                if (digito > 9) digito -= 9;
            }

            soma += digito;
            deveDobrar = !deveDobrar; 
        }

        return (soma % 10) === 0;
    }

    function identificarBandeira(n) {
        if (/^4/.test(n)) return "Visa";
        if (/^5[1-5]/.test(n) || /^(222[1-9]|22[3-9][0-9]|2[3-6][0-9]{2}|27[01][0-9]|2720)/.test(n)) return "Mastercard";
        if (/^3[47]/.test(n)) return "American Express";
        if (/^6(?:011|5[0-9]{2})/.test(n)) return "Discover";
        return "Desconhecida";
    }

    function identificarSetor(primeiroDigito) {
        const setores = {
            '1': "Companhias Aéreas",
            '2': "Companhias Aéreas / Outros",
            '3': "Viagens e Entretenimento",
            '4': "Bancos e Instituições Financeiras (Visa)",
            '5': "Bancos e Instituições Financeiras (Master)",
            '6': "Merchandising e Bancos",
            '7': "Petróleo",
            '8': "Telecomunicações",
            '9': "Atribuição Nacional"
        };
        return setores[primeiroDigito] || "Setor Não Identificado";
    }

    function analisarCartao() {
        const input = document.getElementById('cardNumber').value;
        const pan = input.replace(/\D/g, ''); 
        
        const panel = document.getElementById('resultPanel');
        const header = document.getElementById('statusHeader');

       
        if (pan.length < 13 || pan.length > 16) {
            alert("O número deve conter entre 13 e 16 dígitos.");
            return;
        }

        const eValido = validarLuhn(pan);
        
     
        panel.style.display = 'block';
        header.textContent = eValido ? "CARTÃO MATEMATICAMENTE VÁLIDO" : "CARTÃO INVÁLIDO (LUHN FAIL)";
        header.className = `panel-header ${eValido ? 'valid' : 'invalid'}`;

    
        document.getElementById('valBandeira').textContent = identificarBandeira(pan);
        document.getElementById('valSetor').textContent = identificarSetor(pan[0]);
        document.getElementById('valIIN').textContent = pan.substring(0, 8); 
        
   
        const iinPrefix = pan.substring(0, 4);
        if(pan.startsWith('4026')) document.getElementById('valBanco').textContent = "Banco Bradesco (Visa Gold)";
        else if(pan.startsWith('5411')) document.getElementById('valBanco').textContent = "Itaú Unibanco (Mastercard)";
        else document.getElementById('valBanco').textContent = "Emissor Identificado por IIN Global";
    }
</script>

</body>
</html>
